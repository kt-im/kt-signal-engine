# 自包含 Rust CI（KTAIorg/kt-rust-cli-template 同款基线，2026-08-30 实查 action 主版本）。
# 注: KTAIorg/kt-workflows 共享 polyglot-ci 仓不存在（reuse 解析 0s 失败），故内置。
# protoc: libsignal-message-backup（ADR 0005 S2）build.rs 经 protobuf-codegen 调 protoc。
name: CI

on:
  push:
    branches: [main, develop, pre]
  pull_request:
    branches: [main, develop, pre]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: cargo fmt
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --all-targets -- -D warnings

      # 串行是门禁本体，不是性能选项：测试并行时多用例共享 SQLite/进程级
      # 全局态，偶发全局锁死锁（挂死整个 job）。RUST_MIN_STACK 只给仍留在
      # 门禁里的深栈用例留余量——已知栈溢出用例已 #[ignore]，不靠它兜底。
      - name: cargo test
        env:
          RUST_MIN_STACK: "8388608"
        run: cargo test --all-targets -- --test-threads=1

      - name: cargo build
        run: cargo build --release

# Release 构建矩阵（R5 跨平台交付）：三平台 release 二进制 + SHA-256 校验文件。
#
# action 主版本基线：2026-10-10 实查 GitHub releases API
#   checkout v7.0.1 / upload-artifact v7.0.2 / Swatinem/rust-cache v2.9.2 /
#   dtolnay/rust-toolchain v1（Node24 运行时，无 Node20-only 弃用面）。
# 来源：gh api repos/actions/<repo>/releases/latest。
#
# 构建前置：vendor/libsignal-service/build.rs 经 prost-build 编译自持
# protobuf/ 目录，构建期需要 protoc（与 ci.yml 同款前置，三 runner 均装）。
# sqlite 依赖走 libsqlite3-sys bundled（全图 feature 归一生效，见根
# Cargo.toml），编译期静态链接进二进制，runner 无需系统 sqlite。
#
# 触发：tag push（v*）正式发版；workflow_dispatch 供手工自证/补产物。
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: build ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    runs-on: ${{ matrix.os }}
    # OIDC 角色信任条件是 repo:<org>/<repo>:environment:prod
    environment: prod
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: install protoc (macOS)
        if: runner.os == 'macOS'
        run: brew install protobuf

      - name: install protoc (Windows)
        if: runner.os == 'Windows'
        run: choco install protoc -y --no-progress

      # Windows：静态链接 CRT（+crt-static），产物单 exe，免 VC redist。
      - name: cargo build (Windows, crt-static)
        if: runner.os == 'Windows'
        env:
          RUSTFLAGS: -C target-feature=+crt-static
        run: cargo build --release --target ${{ matrix.target }}

      - name: cargo build (macOS)
        if: runner.os == 'macOS'
        run: cargo build --release --target ${{ matrix.target }}

      - name: package with sha256 (macOS)
        if: runner.os == 'macOS'
        run: |
          mkdir -v dist
          cp -v "target/${{ matrix.target }}/release/kt-signal-engine" \
            "dist/kt-signal-engine-${{ matrix.target }}"
          (
            cd dist
            shasum -a 256 "kt-signal-engine-${{ matrix.target }}" \
              > "kt-signal-engine-${{ matrix.target }}.sha256"
            cat "kt-signal-engine-${{ matrix.target }}.sha256"
          )

      - name: package with sha256 (Windows, crt-static)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          $bin = "kt-signal-engine-${{ matrix.target }}.exe"
          Copy-Item "target/${{ matrix.target }}/release/kt-signal-engine.exe" "dist/$bin"
          $hash = (Get-FileHash -Algorithm SHA256 "dist/$bin").Hash.ToLower()
          "$hash  $bin" | Out-File -Encoding ascii "dist/$bin.sha256"
          Get-Content "dist/$bin.sha256"

      - uses: actions/upload-artifact@v7
        with:
          name: kt-signal-engine-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

      # OIDC → OSS（download.ktai.im）。role 由 KTAIorg/kt-cloud-infra#196 建：
      #   acs:ram::5590716371345016:role/gha-ktim-signal-runtime-prod
      # 只授权写 kontian-assets/kt/signal-runtime/*（显式 Deny Delete）。
      - name: Assume Aliyun OIDC role for OSS publish
        id: aliyun-oidc
        if: ${{ vars.KT_SIGNAL_RUNTIME_OSS_ENABLED == 'true' }}
        uses: aliyun/configure-aliyun-credentials-action@1e5248c8d5d93a8781ac344a68e19a43341e79e6
        with:
          role-to-assume: ${{ vars.KT_SIGNAL_RUNTIME_RAM_ROLE }}
          oidc-provider-arn: acs:ram::5590716371345016:oidc-provider/github-actions-KT-Settlement
          audience: sts.aliyuncs.com
          role-session-name: kt-signal-runtime-engine

      - name: Publish engine to download.ktai.im
        if: ${{ vars.KT_SIGNAL_RUNTIME_OSS_ENABLED == 'true' }}
        env:
          OSS_ACCESS_KEY_ID: ${{ steps.aliyun-oidc.outputs.aliyun-access-key-id }}
          OSS_ACCESS_KEY_SECRET: ${{ steps.aliyun-oidc.outputs.aliyun-access-key-secret }}
          OSS_STS_TOKEN: ${{ steps.aliyun-oidc.outputs.aliyun-security-token }}
          OSS_BUCKET: kontian-assets
          OSS_ENDPOINT: oss-us-west-1.aliyuncs.com
          OSS_PREFIX: kt/signal-runtime/engine
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          if [ -z "${OSS_ACCESS_KEY_ID:-}" ]; then echo "OIDC STS outputs missing" >&2; exit 1; fi
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          if [ "$TARGET" = "x86_64-pc-windows-msvc" ]; then artifact="kt-signal-engine-windows-x64.exe"; src="dist/kt-signal-engine-$TARGET.exe"; else artifact="kt-signal-engine-macos-arm64"; src="dist/kt-signal-engine-$TARGET"; fi
          obj="$OSS_PREFIX/$version/$artifact"
          echo "publishing $src -> oss://$OSS_BUCKET/$obj"

          python3 -m pip install --quiet --disable-pip-version-check oss2
          export SRC="$src" OSS_KEY="$obj"
          python3 - <<'PYEOF'
          import os, hashlib, oss2
          auth = oss2.StsAuth(os.environ['OSS_ACCESS_KEY_ID'], os.environ['OSS_ACCESS_KEY_SECRET'], os.environ['OSS_STS_TOKEN'])
          bucket = oss2.Bucket(auth, 'https://' + os.environ['OSS_ENDPOINT'], os.environ['OSS_BUCKET'])
          src, key = os.environ['SRC'], os.environ['OSS_KEY']
          with open(src, 'rb') as f:
              local_sha = hashlib.sha256(f.read()).hexdigest()
          local_size = os.path.getsize(src)
          if bucket.object_exists(key):
              meta = bucket.head_object(key)
              remote_sha = (meta.headers or {}).get('x-oss-meta-sha256', '')
              if remote_sha and remote_sha != local_sha:
                  raise SystemExit(f"FATAL: oss://{os.environ['OSS_BUCKET']}/{key} holds sha256={remote_sha}, refusing overwrite with {local_sha}. Bump version in Cargo.toml.")
              if meta.content_length != local_size:
                  raise SystemExit(f"FATAL: size {meta.content_length} != local {local_size}. Bump version instead of reusing this path.")
              print(f"already published with identical content, skip: {key}")
          else:
              bucket.put_object_from_file(key, src, headers={'x-oss-meta-sha256': local_sha})
              meta = bucket.head_object(key)
              assert meta.content_length == local_size, 'size mismatch after upload'
              print(f"uploaded {key} size={meta.content_length} sha256={local_sha}")
          print(f"public url: https://download.ktai.im/{key}")
          PYEOF



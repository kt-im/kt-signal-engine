# Release 构建矩阵（R5 跨平台交付）：三平台 release 二进制 + SHA-256 校验文件。
#
# action 主版本基线：2026-10-10 实查 GitHub releases API
#   checkout v7.0.1 / upload-artifact v7.0.2 / Swatinem/rust-cache v2.9.2 /
#   dtolnay/rust-toolchain v1（Node24 运行时，无 Node20-only 弃用面）。
# 来源：gh api repos/actions/<repo>/releases/latest。
#
# 构建前置：vendor/libsignal-service/build.rs 经 prost-build 编译自持
# protobuf/ 目录，构建期需要 protoc（与 ci.yml 同款前置，三 runner 均装）。
# sqlite 依赖走 libsqlite3-sys bundled（全图 feature 归一生效，见根
# Cargo.toml），编译期静态链接进二进制，runner 无需系统 sqlite。
#
# 触发：tag push（v*）正式发版；workflow_dispatch 供手工自证/补产物。
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: build ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    runs-on: ${{ matrix.os }}
    # OIDC 角色信任条件是 repo:<org>/<repo>:environment:prod
    environment: prod
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: install protoc (macOS)
        if: runner.os == 'macOS'
        run: brew install protobuf

      - name: install protoc (Windows)
        if: runner.os == 'Windows'
        run: choco install protoc -y --no-progress

      # Windows：静态链接 CRT（+crt-static），产物单 exe，免 VC redist。
      - name: cargo build (Windows, crt-static)
        if: runner.os == 'Windows'
        env:
          RUSTFLAGS: -C target-feature=+crt-static
        run: cargo build --release --target ${{ matrix.target }}

      - name: cargo build (macOS)
        if: runner.os == 'macOS'
        run: cargo build --release --target ${{ matrix.target }}

      - name: package with sha256 (macOS)
        if: runner.os == 'macOS'
        run: |
          mkdir -v dist
          cp -v "target/${{ matrix.target }}/release/kt-signal-engine" \
            "dist/kt-signal-engine-${{ matrix.target }}"
          (
            cd dist
            shasum -a 256 "kt-signal-engine-${{ matrix.target }}" \
              > "kt-signal-engine-${{ matrix.target }}.sha256"
            cat "kt-signal-engine-${{ matrix.target }}.sha256"
          )

      - name: package with sha256 (Windows, crt-static)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          $bin = "kt-signal-engine-${{ matrix.target }}.exe"
          Copy-Item "target/${{ matrix.target }}/release/kt-signal-engine.exe" "dist/$bin"
          $hash = (Get-FileHash -Algorithm SHA256 "dist/$bin").Hash.ToLower()
          "$hash  $bin" | Out-File -Encoding ascii "dist/$bin.sha256"
          Get-Content "dist/$bin.sha256"

      - uses: actions/upload-artifact@v7
        with:
          name: kt-signal-engine-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

      # OIDC → OSS（download.ktai.im）。角色需要精确前缀内 oss:GetObject/PutObject；
      # catalog.json.locks/* 为不可变版本锁，由生命周期清理；全路径显式 Deny Delete。
      - name: Assume Aliyun OIDC role for OSS publish
        id: aliyun-oidc
        if: ${{ vars.KT_SIGNAL_RUNTIME_OSS_ENABLED == 'true' && matrix.target != 'x86_64-apple-darwin' }}
        uses: aliyun/configure-aliyun-credentials-action@1e5248c8d5d93a8781ac344a68e19a43341e79e6
        with:
          role-to-assume: ${{ vars.KT_SIGNAL_RUNTIME_RAM_ROLE }}
          oidc-provider-arn: acs:ram::5590716371345016:oidc-provider/github-actions-KT-Settlement
          audience: sts.aliyuncs.com
          role-session-name: kt-signal-runtime-engine

      - name: Publish engine to download.ktai.im
        shell: bash
        if: ${{ vars.KT_SIGNAL_RUNTIME_OSS_ENABLED == 'true' && matrix.target != 'x86_64-apple-darwin' }}
        env:
          OSS_ACCESS_KEY_ID: ${{ steps.aliyun-oidc.outputs.aliyun-access-key-id }}
          OSS_ACCESS_KEY_SECRET: ${{ steps.aliyun-oidc.outputs.aliyun-access-key-secret }}
          OSS_STS_TOKEN: ${{ steps.aliyun-oidc.outputs.aliyun-security-token }}
          OSS_BUCKET: kontian-assets
          OSS_ENDPOINT: oss-us-west-1.aliyuncs.com
          OSS_PREFIX: kt/signal-runtime/engine
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          if [ -z "${OSS_ACCESS_KEY_ID:-}" ]; then echo "OIDC STS outputs missing" >&2; exit 1; fi
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          if [ "$TARGET" = "x86_64-pc-windows-msvc" ]; then
            artifact="kt-signal-engine-windows-x64.exe"; src="dist/kt-signal-engine-$TARGET.exe"
          elif [ "$TARGET" = "aarch64-apple-darwin" ]; then
            artifact="kt-signal-engine-macos-arm64"; src="dist/kt-signal-engine-$TARGET"
          else
            echo "platform $TARGET is not catalog-consumed" >&2; exit 1
          fi
          obj="$OSS_PREFIX/$version/$artifact"
          echo "publishing $src -> oss://$OSS_BUCKET/$obj"
          python3 -m pip install --quiet --disable-pip-version-check --break-system-packages oss2
          export SRC="$src" OSS_KEY="$obj"
          python3 - <<'PYEOF'
          import os, hashlib, oss2
          auth = oss2.StsAuth(os.environ['OSS_ACCESS_KEY_ID'], os.environ['OSS_ACCESS_KEY_SECRET'], os.environ['OSS_STS_TOKEN'])
          bucket = oss2.Bucket(auth, 'https://' + os.environ['OSS_ENDPOINT'], os.environ['OSS_BUCKET'])
          src, key = os.environ['SRC'], os.environ['OSS_KEY']
          with open(src, 'rb') as source:
              local_sha = hashlib.sha256(source.read()).hexdigest()
          local_size = os.path.getsize(src)
          if bucket.object_exists(key):
              meta = bucket.head_object(key)
              remote_sha = (meta.headers or {}).get('x-oss-meta-sha256', '')
              if remote_sha and remote_sha != local_sha:
                  raise SystemExit(f'FATAL: {key} holds sha256={remote_sha}, refusing overwrite with {local_sha}. Bump the version.')
              if meta.content_length != local_size:
                  raise SystemExit(f'FATAL: size {meta.content_length} != local {local_size}. Bump the version.')
              print(f'already published with identical content: {key}')
          else:
              bucket.put_object_from_file(key, src, headers={'x-oss-meta-sha256': local_sha})
              meta = bucket.head_object(key)
              if meta.content_length != local_size:
                  raise SystemExit('FATAL: size mismatch after upload')
              print(f'uploaded {key} size={local_size} sha256={local_sha}')
          print(f'public url: https://download.ktai.im/{key}')
          PYEOF

      - name: Checkout shared runtime catalog publisher
        if: ${{ vars.KT_SIGNAL_RUNTIME_OSS_ENABLED == 'true' && matrix.target != 'x86_64-apple-darwin' }}
        uses: actions/checkout@v7
        with:
          repository: kt-im/kt-signal-connector
          ref: 3c7ee2ad2e5151a9c5c8c1142334f06322279fd1
          token: ${{ secrets.KT_SIGNAL_RUNTIME_CONNECTOR_READ_TOKEN }}
          path: .release/kt-signal-connector

      - name: Publish runtime set catalog
        shell: bash
        if: ${{ vars.KT_SIGNAL_RUNTIME_OSS_ENABLED == 'true' && matrix.target != 'x86_64-apple-darwin' }}
        env:
          OSS_ACCESS_KEY_ID: ${{ steps.aliyun-oidc.outputs.aliyun-access-key-id }}
          OSS_ACCESS_KEY_SECRET: ${{ steps.aliyun-oidc.outputs.aliyun-access-key-secret }}
          OSS_STS_TOKEN: ${{ steps.aliyun-oidc.outputs.aliyun-security-token }}
          OSS_BUCKET: kontian-assets
          OSS_ENDPOINT: oss-us-west-1.aliyuncs.com
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          if [ "$TARGET" = "x86_64-pc-windows-msvc" ]; then
            platform="windows-x64"; artifact="kt-signal-engine-windows-x64.exe"; src="dist/kt-signal-engine-$TARGET.exe"; set -- --skip-runtime-verification
          elif [ "$TARGET" = "aarch64-apple-darwin" ]; then
            platform="macos-arm64"; artifact="kt-signal-engine-macos-arm64"; src="dist/kt-signal-engine-$TARGET"; set --
          else
            echo "platform $TARGET is not catalog-consumed" >&2; exit 1
          fi
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          python3 -m pip install --quiet --disable-pip-version-check --break-system-packages oss2
          python3 - <<'PY' > .release-values.env
          import re
          from pathlib import Path

          def rust_constant(path, key):
              text = Path(path).read_text()
              match = re.search(rf'const\s+{re.escape(key)}:\s*&str\s*=\s*"([^"]+)"', text)
              if not match:
                  raise SystemExit(f'missing {key}')
              return match.group(1)

          print(f"ENGINE_CONTRACT_REVISION={rust_constant('src/contract.rs', 'CONTRACT_REVISION')}")
          print(f"DESKTOP_API_VERSION={rust_constant('src/contract.rs', 'DESKTOP_API_VERSION')}")
          PY
          . ./.release-values.env
          python3 .release/kt-signal-connector/scripts/signal_runtime_catalog.py \
            --source "oss://$OSS_BUCKET/kt/signal-runtime/catalog.json" \
            --component engine \
            --version "$version" \
            --platform "$platform" \
            --artifact "$src" \
            --primary-url "https://download.ktai.im/kt/signal-runtime/engine/$version/$artifact" \
            --source-revision "$GITHUB_SHA" \
            --desktop-api "$DESKTOP_API_VERSION" \
            --contract-min "$ENGINE_CONTRACT_REVISION" \
            --contract-max "$ENGINE_CONTRACT_REVISION" \
            "$@"

